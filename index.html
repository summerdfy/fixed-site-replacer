<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固定网站显示替换 - 脚本下载</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 640px; margin: 0 auto; }
  .acc-list { max-height: 60vh; overflow-y: auto; border: 1px solid #e0c9a6; border-radius: 10px; background: #fdf6ec; padding: 10px; }
  .acc-list .acc-item { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #f0e2cc; }
  .acc-list .acc-item:last-child { border-bottom: none; }
  .acc-list input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  .acc-list button { flex: 0 0 auto; padding: 8px 12px; border: none; border-radius: 6px; background: #0a66c2; color: #fff; font-size: 13px; }
  .btn-copy-all { padding: 10px 18px; border: none; border-radius: 8px; background: #0a66c2; color: #fff; font-size: 15px; margin-bottom: 8px; }
  .locked-box { padding: 14px; border: 1px solid #e0c9a6; border-radius: 10px; background: #fdf6ec; margin-bottom: 8px; }
</style>
</head>
<body>
<h2>📦 下载 code.js（最新版）</h2>
<ul style="font-size:18px;line-height:2">
  <li><a href="code.js">code.js</a> ⭐ 最新版</li>
  <li><a href="code-v0.6.1.user.js">code-v0.6.1.user.js</a> (v0.6.1)</li>

<hr>

<p style="font-size:18px;line-height:1.8">
  <a href="https://parks2.bandainamco-am.co.jp/" style="color:#0a66c2;word-break:break-all">https://parks2.bandainamco-am.co.jp/</a>
</p>
<p style="color:#888">👆 直接点击可打开网站；长按链接可弹出菜单「拷贝」，复制网址。</p>
<hr>
<h3>🔑 切换账号（邮箱列表）</h3>
<div id="acc-locked" class="locked-box">
  <div style="font-weight:600;margin-bottom:8px">🔒 此区域已锁定，请输入访问口令</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input type="password" id="acc-key" placeholder="输入口令" style="flex:1;min-width:140px;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box">
    <button onclick="unlockAccounts()" style="flex:0 0 auto;padding:8px 16px;border:none;border-radius:6px;background:#0a66c2;color:#fff;font-size:14px">解锁</button>
  </div>
  <div id="acc-msg" style="color:#b00020;font-size:12px;margin-top:6px"></div>
</div>
<div id="acc-area" style="display:none">
  <button class="btn-copy-all" onclick="copyAll()">📋 复制全部邮箱</button>
  <div class="acc-list" id="acc-list"></div>
</div>

<script src="accounts.js"></script>
<script>
var PASSCODE = "8899";

function legacyCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
  done();
}

function copyText(text, btn) {
  var done = function () {
    var old = btn.textContent;
    btn.textContent = '已复制 ✔';
    setTimeout(function () { btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else {
    legacyCopy(text, done);
  }
}

function unlockAccounts() {
  var key = document.getElementById('acc-key').value.trim();
  var msg = document.getElementById('acc-msg');
  if (key !== PASSCODE) {
    msg.textContent = '❌ 口令错误';
    return;
  }
  msg.textContent = '';
  document.getElementById('acc-locked').style.display = 'none';
  var area = document.getElementById('acc-area');
  area.style.display = '';
  var list = document.getElementById('acc-list');
  list.innerHTML = '';
  ACCOUNT_EMAILS.forEach(function (email, i) {
    var row = document.createElement('div');
    row.className = 'acc-item';
    row.innerHTML =
      '<input type="text" readonly value="' + email.replace(/"/g, '&quot;') + '" id="acc-mail-' + i + '">' +
      '<button onclick="copyText(document.getElementById(\'acc-mail-' + i + '\').value, this)">复制</button>';
    list.appendChild(row);
  });
}

function copyAll() {
  var text = ACCOUNT_EMAILS.join('\n');
  var btn = document.querySelector('.btn-copy-all');
  copyText(text, btn);
}
</script>
</body>
</html>

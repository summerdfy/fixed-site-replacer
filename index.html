<style>
  body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 640px; margin: 0 auto; }
  .acc-list { max-height: 60vh; overflow-y: auto; border: 1px solid #e0c9a6; border-radius: 10px; background: #fdf6ec; padding: 10px; }
  .acc-list .acc-item { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #f0e2cc; }
  .acc-list .acc-item:last-child { border-bottom: none; }
  .acc-list input { flex: 1; min-width: 0; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  .acc-list button { flex: 0 0 auto; padding: 8px 12px; border: none; border-radius: 6px; background: #0a66c2; color: #fff; font-size: 13px; }
  .acc-list .time-tag { flex: 0 0 auto; font-size: 12px; color: #8a5a00; background: #fdf0d8; border-radius: 10px; padding: 4px 8px; }
  .btn-copy-all { padding: 10px 18px; border: none; border-radius: 8px; background: #0a66c2; color: #fff; font-size: 15px; margin-bottom: 8px; }
  .locked-box { padding: 14px; border: 1px solid #e0c9a6; border-radius: 10px; background: #fdf6ec; margin-bottom: 8px; }
  .store-block { margin-bottom: 24px; }
</style>
</head>

<!-- 8/23 東京渋谷店 -->
<div class="store-block">
  <h3>🔑 8/23 東京渋谷店账号（76）</h3>
  <div id="acc-locked-shibuya" class="locked-box">
    <div style="font-weight:600;margin-bottom:8px">🔒 此区域已锁定，请输入访问口令</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="password" id="acc-key-shibuya" placeholder="输入口令" style="flex:1;min-width:140px;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box">
      <button onclick="unlockStore('shibuya')" style="flex:0 0 auto;padding:8px 16px;border:none;border-radius:6px;background:#0a66c2;color:#fff;font-size:14px">解锁</button>
    </div>
    <div id="acc-msg-shibuya" style="color:#b00020;font-size:12px;margin-top:6px"></div>
  </div>
  <div id="acc-area-shibuya" style="display:none">
    <button class="btn-copy-all" onclick="copyAll('shibuya')">📋 复制全部邮箱</button>
    <div class="acc-list" id="acc-list-shibuya"></div>
  </div>
</div>

<!-- 8/23 愛知名古屋店 -->
<div class="store-block">
  <h3>🔑 8/23 愛知名古屋店账号（55）</h3>
  <div id="acc-locked-nagoya" class="locked-box">
    <div style="font-weight:600;margin-bottom:8px">🔒 此区域已锁定，请输入访问口令</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="password" id="acc-key-nagoya" placeholder="输入口令" style="flex:1;min-width:140px;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box">
      <button onclick="unlockStore('nagoya')" style="flex:0 0 auto;padding:8px 16px;border:none;border-radius:6px;background:#0a66c2;color:#fff;font-size:14px">解锁</button>
    </div>
    <div id="acc-msg-nagoya" style="color:#b00020;font-size:12px;margin-top:6px"></div>
  </div>
  <div id="acc-area-nagoya" style="display:none">
    <button class="btn-copy-all" onclick="copyAll('nagoya')">📋 复制全部邮箱</button>
    <div class="acc-list" id="acc-list-nagoya"></div>
  </div>
</div>

<script src="shibuya-accounts.js"></script>
<script src="nagoya-accounts.js"></script>
<script>
var PASSCODE = {
  shibuya: "8899",
  nagoya: "1358"
};

var STORES = {
  shibuya: { key: "acc-key-shibuya", msg: "acc-msg-shibuya", locked: "acc-locked-shibuya", area: "acc-area-shibuya", list: "acc-list-shibuya", data: SHIBUYA_ACCOUNTS },
  nagoya: { key: "acc-key-nagoya", msg: "acc-msg-nagoya", locked: "acc-locked-nagoya", area: "acc-area-nagoya", list: "acc-list-nagoya", data: NAGOYA_ACCOUNTS }
};

function legacyCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  try { document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
  done();
}

function copyText(text, btn) {
  var done = function () {
    var old = btn.textContent;
    btn.textContent = '已复制 ✔';
    setTimeout(function () { btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
  } else {
    legacyCopy(text, done);
  }
}

function unlockStore(storeName) {
  var cfg = STORES[storeName];
  var key = document.getElementById(cfg.key).value.trim();
  var msg = document.getElementById(cfg.msg);
  if (key !== PASSCODE[storeName]) {
    msg.textContent = '❌ 口令错误';
    return;
  }
  msg.textContent = '';
  document.getElementById(cfg.locked).style.display = 'none';
  var area = document.getElementById(cfg.area);
  area.style.display = '';
  var list = document.getElementById(cfg.list);
  list.innerHTML = '';
  cfg.data.forEach(function (item, i) {
    var row = document.createElement('div');
    row.className = 'acc-item';
    row.innerHTML =
      '<input type="text" readonly value="' + String(item.email || "").replace(/"/g, '&quot;') + '" id="acc-mail-' + storeName + '-' + i + '">' +
      (item.time ? '<span class="time-tag">' + item.time + '</span>' : '') +
      '<button onclick="copyText(document.getElementById(\'acc-mail-' + storeName + '-' + i + '\').value, this)">复制</button>';
    list.appendChild(row);
  });
}

function copyAll(storeName) {
  var cfg = STORES[storeName];
  var text = cfg.data.map(function (item) { return item.email + (item.time ? "  " + item.time : ""); }).join('\n');
  var btn = document.querySelector('.store-block #acc-area-' + storeName + ' .btn-copy-all');
  copyText(text, btn);
}
</script>
</body>
</html>
